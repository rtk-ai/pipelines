name: validate-pr
on:
  # pull_request_target: the workflow and the scripts that run are always the
  # base branch's, never the PR's. The PR is fetched as data and read out of
  # git; nothing from it is checked out or executed. The job holds only a
  # read token. The check is required on main, so it must always report; the
  # script exits 0 immediately when no snapshot or revocation changed.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate-pr:
    name: validate-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fetch the PR head as data (not checked out)
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .cache/rtk
          key: rtk-${{ hashFiles('rtk.pin') }}-${{ runner.os }}-${{ runner.arch }}
      - id: rtk
        run: echo "bin=$(bash scripts/rtk-pinned.sh)" >> "$GITHUB_OUTPUT"
      - name: Snapshots byte-identical to upstream, precheck still passes, schemas valid
        run: node scripts/validate-pr.mjs
        env:
          RTK_BIN: ${{ steps.rtk.outputs.bin }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          HEAD_REF: refs/remotes/pr/head
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
