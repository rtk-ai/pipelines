# benchmark.toml — numbers published by the pipeline author.
# The marketplace shows them as "author's benchmark"; the bot checks the shape only.
schema_version = 1

[benchmark]
suite          = "SkillsBench"
agent          = "Claude Code"
model          = "claude-opus-5-5"
baseline       = "stock Claude Code"
trials_per_arm = 44
dates          = ["2026-10-22", "2026-10-23"]
details        = "RESULTS.md"
raw            = "results.tsv"
notes          = "11 tasks, 4 trials per arm per task, both arms in the same batch; pass rate = mean of the per-task pass rates; trials that errored or ran past the task time limit excluded (-24.0% with timed-out-but-passing trials counted). azure-bgp-oscillation-route-leak and llm-prefix-cache-replay score 0 for every model and count for cost only. A second run on 6 of these tasks (2026-10-21/22, OFF / laya-delegate / laya-tiered in one batch) gave -26.7% with reward 0.72 -> 0.85 (laya-delegate -13.0%); see RESULTS.md. Costs 1.5-1.8x the wall-clock of stock Claude Code."

[benchmark.cost]
# mean cost per trial, USD, summed over the 11 tasks
baseline = 4.312
pipeline = 3.440
per      = "trial"

[benchmark.quality]
metric   = "reward"
baseline = 0.66
pipeline = 0.64

